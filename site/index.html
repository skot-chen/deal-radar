<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>线报雷达</title>
<meta name="description" content="淘宝、天猫、1688、京东、拼多多、美团、饿了么的券怎么领、几点抢、怎么叠加最划算；另有豆瓣买组拼组最新线报。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="线报雷达">
<meta name="theme-color" content="#eef2e6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#18201b" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23eef2e6'/%3E%3Cellipse cx='32' cy='33' rx='22' ry='17' fill='none' stroke='%23d0271d' stroke-width='5' transform='rotate(-8 32 33)'/%3E%3Ctext x='32' y='42' font-size='24' text-anchor='middle' fill='%23d0271d' font-family='sans-serif' font-weight='700'%3E¥%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #eef2e6;      /* exercise-book green */
    --rule: #cddbc3;       /* ruled lines */
    --margin: #e6a9a3;     /* red margin line */
    --ink: #1c2b45;        /* fountain-pen blue-black */
    --pencil: #66705f;     /* secondary text */
    --red: #d0271d;        /* teacher's red pen */
    --tab: #dfe8d3;
    --focus: #1c55c9;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #18201b; --rule: #27342b; --margin: #5a2d2a; --ink: #e3e9dc;
      --pencil: #9aa592; --red: #ff6a5c; --tab: #213026; --focus: #8fb4ff; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #18201b; --rule: #27342b; --margin: #5a2d2a; --ink: #e3e9dc;
    --pencil: #9aa592; --red: #ff6a5c; --tab: #213026; --focus: #8fb4ff; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 16px/1.7 -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    /* ruled exercise-book lines, 34px apart */
    background-image: linear-gradient(to bottom, transparent 33px, var(--rule) 33px, var(--rule) 34px);
    background-size: 100% 34px;
    background-attachment: local;
    min-height: 100vh;
  }
  .page {
    max-width: 680px; margin: 0 auto; position: relative;
    padding: max(20px, env(safe-area-inset-top)) 16px 64px 40px;
  }
  /* red margin line down the left, like a school notebook */
  .page::before {
    content: ""; position: absolute; top: 0; bottom: 0; left: 26px; width: 2px; background: var(--margin);
  }
  header h1 {
    margin: 6px 0 0; font-size: 30px; line-height: 1.2; letter-spacing: .02em;
    font-family: "Songti SC", "STSong", "SimSun", "Noto Serif SC", serif; font-weight: 900;
  }
  .lede { margin: 6px 0 0; color: var(--pencil); font-size: 14px; max-width: 32em; }
  .status { margin: 4px 0 0; font-size: 13px; color: var(--pencil); }
  .status.stale { color: var(--red); }
  .statusbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 4px; }
  .statusbar .status { margin: 0; }
  #refresh {
    flex: none; font: inherit; font-size: 14px; font-weight: 700; color: var(--red); cursor: pointer;
    background: transparent; border: 2px solid var(--red); border-radius: 999px; padding: 4px 16px; min-height: 36px;
  }
  #refresh:disabled { opacity: .55; cursor: default; }
  #refresh:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  nav { display: flex; gap: 6px; margin: 22px 0 6px; }
  nav button {
    font: inherit; font-size: 16px; font-weight: 700; color: var(--pencil); cursor: pointer;
    background: transparent; border: 2px solid transparent; border-bottom: none;
    padding: 6px 18px 4px; border-radius: 10px 10px 0 0;
  }
  nav button[aria-selected="true"] { color: var(--ink); background: var(--tab); border-color: var(--rule); }
  nav button:focus-visible, a:focus-visible, .src button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .hint { font-size: 13px; color: var(--pencil); margin: 0 0 6px; }

  .src { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
  .src button {
    font: inherit; font-size: 13px; color: var(--pencil); background: transparent; cursor: pointer;
    border: 1.5px solid var(--rule); border-radius: 999px; padding: 1px 12px;
  }
  .src button[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); background: var(--tab); }
  .src .n { font-size: 11px; opacity: .7; }
  #grp button { font-weight: 700; }
  .tag { color: var(--ink); }
  .pager { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 18px 0 0; font-size: 14px; color: var(--pencil); }
  .pager[hidden] { display: none; }
  .pager button {
    font: inherit; font-weight: 700; color: var(--ink); background: var(--tab); cursor: pointer;
    border: 1.5px solid var(--rule); border-radius: 10px; padding: 8px 18px; min-height: 44px;
  }
  .pager button:disabled { color: var(--pencil); opacity: .5; cursor: default; }
  .pager button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  ol { list-style: none; margin: 0; padding: 0; }
  li { display: grid; grid-template-columns: 1fr auto; gap: 4px 14px; padding: 12px 0 13px; border-bottom: 1px dashed var(--rule); }
  li a { color: var(--ink); text-decoration: none; font-size: 16px; line-height: 1.55; overflow-wrap: anywhere; }
  li a:hover { text-decoration: underline; text-decoration-color: var(--red); }
  li a:visited { color: var(--pencil); }
  .meta { grid-column: 1; font-size: 13px; color: var(--pencil); display: flex; flex-wrap: wrap; gap: 0 12px; }
  .fire { color: var(--red); }

  /* the one bold element: the price, circled in red pen */
  .price {
    grid-column: 2; grid-row: 1 / span 2; align-self: center; justify-self: end;
    font-family: "Caveat", "Segoe Print", cursive; font-weight: 700; color: var(--red);
    font-size: 26px; line-height: 1; white-space: nowrap; text-align: center; position: relative;
    padding: 8px 12px; min-width: 64px;
  }
  .price::after {
    content: ""; position: absolute; inset: 0; border: 2px solid var(--red); border-radius: 50%;
    transform: rotate(-6deg); opacity: .85;
  }
  .price.long { font-size: 20px; }
  .price.none { color: var(--pencil); font-size: 18px; }
  .price.none::after { display: none; }
  .price s { display: block; font-size: 17px; color: var(--pencil); text-decoration-color: var(--red); text-decoration-thickness: 2px; }
  .price small { display: block; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 11px; font-weight: 400; color: var(--red); margin-top: 2px; }

  .empty { padding: 24px 0; color: var(--pencil); }

  /* ---------- view switch ---------- */
  .views { display: flex; gap: 8px; margin: 20px 0 4px; border-bottom: 2px solid var(--ink); }
  .views a {
    color: var(--pencil); text-decoration: none; font-weight: 700; font-size: 17px;
    padding: 8px 14px 6px; border-radius: 10px 10px 0 0; border: 2px solid transparent; border-bottom: none; margin-bottom: -2px;
  }
  .views a[aria-selected="true"] { color: var(--ink); background: var(--paper); border-color: var(--ink); }
  .views a:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  h2 { font-family: "Songti SC", "STSong", "SimSun", "Noto Serif SC", serif; font-weight: 900; font-size: 21px; line-height: 1.3; margin: 0; }
  h2.sect { margin: 28px 0 10px; }
  .src.big button { font-size: 15px; font-weight: 700; padding: 3px 14px; }

  /* ---------- today's grab clock ---------- */
  .today { margin-top: 18px; }
  .today .hint { margin: 4px 0 8px; }
  .clock li { grid-template-columns: 74px 1fr; gap: 2px 12px; padding: 9px 0; }
  .clock .t {
    grid-row: 1 / span 2; align-self: center; font-family: "Caveat", "Segoe Print", cursive; font-weight: 700;
    font-size: 30px; line-height: 1; color: var(--red); text-align: right;
  }
  .clock li.past .t { color: var(--pencil); text-decoration: line-through; text-decoration-thickness: 2px; }
  .clock li.next .t::after { content: "下一场"; display: block; font: 700 11px/1.4 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--red); }
  .clock .w { font-weight: 700; }
  .clock .w small { font-weight: 400; color: var(--pencil); margin-left: 6px; }
  .clock .d { grid-column: 2; font-size: 13px; color: var(--pencil); }
  .more { font: inherit; font-size: 14px; color: var(--ink); background: none; border: none; padding: 8px 0; cursor: pointer; text-decoration: underline; text-decoration-color: var(--red); }

  /* ---------- platform card ---------- */
  .pcard { margin-top: 8px; }
  .pcard .sum { font-size: 15px; margin: 8px 0 14px; }
  .pcard h3 { font-size: 16px; margin: 18px 0 6px; }
  .order { counter-reset: s; margin: 0; padding: 0; }
  .order li { display: block; padding: 4px 0 4px 34px; border: none; position: relative; }
  .order li::before {
    counter-increment: s; content: counter(s); position: absolute; left: 0; top: 5px; width: 24px; height: 24px; border-radius: 50%;
    border: 2px solid var(--red); color: var(--red); font: 700 13px/20px -apple-system, sans-serif; text-align: center;
  }
  .receipt { border: 1.5px dashed var(--pencil); border-radius: 6px; padding: 10px 14px; background: var(--paper); max-width: 380px; }
  .receipt .rt { font-weight: 700; margin-bottom: 4px; }
  .receipt .row { display: flex; justify-content: space-between; gap: 12px; font-variant-numeric: tabular-nums; }
  .receipt .row.minus span:last-child { color: var(--red); }
  .receipt .row.total { border-top: 1.5px solid var(--ink); margin-top: 4px; padding-top: 4px; font-weight: 700; }
  .receipt .row.total span:last-child { font-family: "Caveat", cursive; font-size: 26px; color: var(--red); line-height: 1; }
  .receipt .note { font-size: 12px; color: var(--pencil); margin-top: 4px; }
  .coupons li { display: block; padding: 14px 0; }
  .coupons .nm { font-weight: 700; font-size: 17px; }
  .stamp {
    display: inline-block; font-size: 12px; font-weight: 700; padding: 0 7px; margin-left: 8px; border-radius: 4px; vertical-align: 2px;
    border: 1.5px solid var(--ink); color: var(--ink);
  }
  .stamp.hot { border-color: var(--red); color: var(--red); transform: rotate(-3deg); }
  .stamp.check { border-color: var(--pencil); color: var(--pencil); border-style: dashed; }
  .coupons dl { margin: 6px 0 0; display: grid; grid-template-columns: 52px 1fr; gap: 3px 10px; font-size: 14px; }
  .coupons dt { color: var(--pencil); }
  .coupons dd { margin: 0; }
  .coupons .tm { color: var(--red); font-weight: 700; }
  .coupons .srcs { font-size: 12px; color: var(--pencil); margin-top: 6px; overflow-wrap: anywhere; }
  .coupons .srcs a { color: var(--pencil); }

  /* ---------- calculator ---------- */
  .calc { margin-top: 30px; border-top: 2px solid var(--ink); padding-top: 10px; }
  .calc summary { cursor: pointer; font-weight: 700; font-size: 17px; padding: 6px 0; }
  .calc summary:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .calc label { display: block; font-size: 14px; color: var(--pencil); margin: 10px 0 4px; }
  .calc input, .calc select {
    font: inherit; font-size: 16px; color: var(--ink); background: var(--paper); border: 1.5px solid var(--rule); border-radius: 8px;
    padding: 6px 10px; min-height: 40px;
  }
  .calc input:focus-visible, .calc select:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }
  .calc .line { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0; }
  .calc .line input { width: 84px; }
  .calc .line .x { font: inherit; background: none; border: none; color: var(--red); font-size: 20px; cursor: pointer; padding: 0 6px; min-height: 40px; }
  .calc .add { font: inherit; font-weight: 700; color: var(--ink); background: var(--tab); border: 1.5px solid var(--rule); border-radius: 10px; padding: 6px 14px; cursor: pointer; margin-top: 6px; min-height: 40px; }
  .calc .out { margin-top: 14px; }
  .calc .tip { font-size: 14px; color: var(--red); margin-top: 6px; }
  .steps { counter-reset: st; margin: 8px 0 0; padding: 0; }
  .steps li { display: block; border: none; padding: 3px 0 3px 30px; position: relative; font-size: 15px; }
  .steps li::before {
    counter-increment: st; content: counter(st); position: absolute; left: 0; top: 5px; width: 21px; height: 21px; border-radius: 50%;
    background: var(--ink); color: var(--paper); font: 700 12px/21px -apple-system, sans-serif; text-align: center;
  }
  .when { margin: 6px 0 0; color: var(--red); font-weight: 700; font-size: 14px; }
  .go {
    display: inline-flex; align-items: center; justify-content: center; margin-top: 10px; min-height: 44px; padding: 0 22px;
    background: var(--red); color: #fff; font-weight: 700; font-size: 16px; text-decoration: none; border-radius: 999px;
  }
  .go:visited { color: #fff; }
  .go:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  details.why, details.rules { margin-top: 8px; }
  details.why summary, details.rules summary { cursor: pointer; font-size: 13px; color: var(--pencil); padding: 4px 0; }
  details.rules { border-top: 1px dashed var(--rule); padding-top: 8px; margin-top: 14px; }
  details.rules summary { font-size: 15px; color: var(--ink); font-weight: 700; }
  details.rules .order { margin: 8px 0 12px; }
  .foot-note { font-size: 13px; color: var(--pencil); }
  footer { margin-top: 28px; font-size: 13px; color: var(--pencil); }
  footer p { margin: 4px 0; }
  @media (max-width: 420px) {
    .page { padding-left: 32px; }
    .page::before { left: 18px; }
    header h1 { font-size: 26px; }
    .price { font-size: 23px; min-width: 56px; padding: 7px 9px; }
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>线报雷达</h1>
    <p class="lede">选平台，照着 1、2、3 做，点红色按钮直接去领券。</p>
  </header>

  <div class="views" role="tablist" aria-label="切换内容">
    <a href="#rules" role="tab" id="go-rules" aria-selected="true">📘 省钱规则</a>
    <a href="#deals" role="tab" id="go-deals" aria-selected="false">📰 最新线报</a>
  </div>

  <section id="rules-view" aria-labelledby="go-rules">
    <div class="today" id="today">
      <h2>今天几点抢券</h2>
      <p class="hint" id="today-hint">正在载入…</p>
      <ol class="clock" id="clock"></ol>
    </div>

    <h2 class="sect">按平台查</h2>
    <div class="src big" id="r-group" role="group" aria-label="大分类"></div>
    <div class="src" id="r-plat" role="group" aria-label="平台"></div>
    <div class="src" id="r-tag" role="group" aria-label="券的类型"></div>
    <div id="platform"></div>

    <details class="calc" id="calc">
      <summary>🧮 叠加计算器：算算到手多少钱</summary>
      <div id="calc-body"></div>
    </details>
  </section>

  <section id="deals-view" aria-labelledby="go-deals" hidden>
  <div class="statusbar">
    <p class="status" id="status" role="status">正在载入…</p>
    <button type="button" id="refresh">刷新</button>
  </div>
  <nav role="tablist" aria-label="排序" id="tabs">
    <button role="tab" id="tab-hot" aria-selected="true" aria-controls="list">🔥 最热</button>
    <button role="tab" id="tab-new" aria-selected="false" aria-controls="list">🆕 最新</button>
  </nav>
  <p class="hint" id="hint"></p>
  <div class="src" id="grp" role="group" aria-label="按小组看"></div>
  <div class="src" id="cat" role="group" aria-label="按分类看"></div>
  <ol id="list" role="tabpanel" aria-live="polite"></ol>
  <div class="pager" id="pager" hidden>
    <button type="button" id="prev">上一页</button>
    <span id="pageinfo"></span>
    <button type="button" id="next">下一页</button>
  </div>
  <p class="foot-note">线报到手价是从帖子标题里自动读出来的，下单前请以页面实际价格为准。</p>
  </section>

  <footer>
    <p>规则来自各平台公开的活动说明和新闻，每条都写了核实日期和来源。平台常常调整，标 ⚠️ 的请以 App 里为准。</p>
    <p>本页只整理信息，不会帮你下单或抢券，也没有任何返利链接。</p>
  </footer>
</div>
<script src="rules.js" defer></script>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  let data = null;
  let tab = store.get('tab') === 'new' ? 'new' : 'hot';
  let cat = store.get('cat') || '';
  let grp = store.get('grp') || '';
  const GROUP_NAMES = { 豆瓣买组: '买组 · All buy · 不买不可能', 豆瓣拼组: '拼组 · 我跟你拼了！' };
  let page = 1;
  const PER_PAGE = 20;

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const yuan = (v) => (v == null ? '' : '¥' + (Number.isInteger(v) ? v : v.toFixed(2).replace(/0$/, '')));
  function ago(iso) {
    const m = Math.round((Date.now() - Date.parse(iso)) / 60000);
    if (m < 1) return '刚刚';
    if (m < 60) return m + ' 分钟前';
    const h = Math.round(m / 60);
    if (h < 24) return h + ' 小时前';
    return Math.round(h / 24) + ' 天前';
  }

  function priceHtml(d) {
    if (d.price == null && d.lower == null) return '<div class="price none" aria-label="没写到手价">?</div>';
    if (d.lower != null && (d.price == null || d.lower < d.price)) {
      return `<div class="price" aria-label="到手价 ${yuan(d.lower)}，评论区找到的更低价">${d.price != null ? `<s>${yuan(d.price)}</s>` : ''}${yuan(d.lower)}<small>评论区更低</small></div>`;
    }
    const p = yuan(d.price);
    return `<div class="price${p.length > 6 ? ' long' : ''}" aria-label="到手价 ${p}">${p}</div>`;
  }

  function render() {
    for (const [id, name] of [['tab-hot', 'hot'], ['tab-new', 'new']]) $(id).setAttribute('aria-selected', String(tab === name));
    if (!data) return;
    $('hint').textContent = tab === 'hot'
      ? '跟帖越多、越快，排得越靠前。只有豆瓣小组有回复数。'
      : '按发帖时间排，最新的在最上面。';
    const list = tab === 'hot' ? data.hot : data.latest;
    const groups = ['豆瓣买组', '豆瓣拼组'];
    const gcount = (g) => list.filter((d) => d.source === g).length;
    $('grp').innerHTML = [['', '全部小组', list.length], ...groups.map((g) => [g, GROUP_NAMES[g], gcount(g)])]
      .map(([g, label, n]) => `<button type="button" data-g="${esc(g)}" aria-pressed="${g === grp}">${esc(label)} <span class="n">${n}</span></button>`)
      .join('');
    const all = list.filter((d) => !grp || d.source === grp);
    const counts = {};
    for (const d of all) counts[d.category] = (counts[d.category] || 0) + 1;
    const cats = (data.categories || []).filter((c) => counts[c]);
    if (cat && !counts[cat]) cat = '';
    $('cat').innerHTML = [['', all.length], ...cats.map((c) => [c, counts[c]])]
      .map(([c, n]) => `<button type="button" data-c="${esc(c)}" aria-pressed="${c === cat}">${c ? esc(c) : '全部'} <span class="n">${n}</span></button>`)
      .join('');
    const rows = all.filter((d) => !cat || d.category === cat);
    const pages = Math.max(1, Math.ceil(rows.length / PER_PAGE));
    page = Math.min(Math.max(1, page), pages);
    const shown = rows.slice((page - 1) * PER_PAGE, page * PER_PAGE);
    $('list').innerHTML = shown.length
      ? shown.map((d) => `<li>
          <a href="${esc(d.url)}" target="_blank" rel="noopener noreferrer">${esc(d.title)}</a>
          ${priceHtml(d)}
          <div class="meta"><span class="tag">${esc(d.category)}</span><span>${esc(d.source)}</span><span>${ago(d.posted)}</span>${d.replies != null ? `<span>${d.replies} 回复</span>` : ''}${d.heat >= 1 ? `<span class="fire">每小时 +${Math.round(d.heat)} 回复</span>` : ''}</div>
        </li>`).join('')
      : `<li class="empty">${emptyText()}</li>`;
    $('pager').hidden = pages <= 1;
    $('prev').disabled = page <= 1;
    $('next').disabled = page >= pages;
    $('pageinfo').textContent = `第 ${page} / ${pages} 页`;
  }

  function emptyText() {
    if (!data.latest.length) return '豆瓣暂时不让访客查看小组，正在等它恢复。恢复后新的作业会自动出现在这里。';
    if (tab === 'hot') return '现在没有正在变热的作业，看看“最新”吧。';
    return '这个分类暂时还没有作业。';
  }

  function renderStatus() {
    if (!data) return;
    const mins = (Date.now() - Date.parse(data.updatedAt)) / 60000;
    const el = $('status');
    el.className = 'status' + (mins > 30 ? ' stale' : '');
    el.textContent = mins > 30
      ? `已经 ${ago(data.updatedAt).replace('前', '')}没有更新了：收集线报的电脑可能暂时关着。下面是最后一次的内容。`
      : `${ago(data.updatedAt)}更新 · 共 ${data.count} 条作业`;
  }

  async function load() {
    try {
      const r = await fetch('deals.json?t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) throw new Error(r.status);
      const first = !data;
      data = await r.json();
      // Nothing is trending yet and the visitor never picked a tab: start on "最新".
      if (first && !data.hot.length && !store.get('tab')) tab = 'new';
      render();
      renderStatus();
    } catch {
      if (!data) $('status').textContent = '暂时读不到线报数据，请稍后刷新页面。';
    }
  }

  const toTop = () => $('tabs').scrollIntoView({ block: 'start', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  $('tab-hot').onclick = () => { tab = 'hot'; page = 1; store.set('tab', tab); render(); };
  $('tab-new').onclick = () => { tab = 'new'; page = 1; store.set('tab', tab); render(); };
  $('cat').onclick = (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    cat = b.dataset.c;
    page = 1;
    store.set('cat', cat);
    render();
  };
  $('refresh').onclick = async () => {
    const b = $('refresh');
    const before = data && data.updatedAt;
    b.disabled = true;
    b.textContent = '刷新中…';
    await load();
    b.textContent = data && data.updatedAt !== before ? '已更新' : '已是最新';
    setTimeout(() => { b.textContent = '刷新'; b.disabled = false; }, 1500);
  };
  $('grp').onclick = (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    grp = b.dataset.g;
    page = 1;
    store.set('grp', grp);
    render();
  };
  $('prev').onclick = () => { page--; render(); toTop(); };
  $('next').onclick = () => { page++; render(); toTop(); };
  load();
  setInterval(load, 2 * 60 * 1000);
  setInterval(renderStatus, 30 * 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
})();
</script>
</body>
</html>
